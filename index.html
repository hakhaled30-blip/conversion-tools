<!DOCTYPE html>
<html lang="en" id="html-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Conversion Tools</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #2c3e50;
        }
        .lang-switcher button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 6px 12px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .lang-switcher button:hover {
            background-color: #2980b9;
        }
        .container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #2c3e50; }
        p { color: #555; line-height: 1.6; }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="txt-logo">Conversion Tools</div>
        <div class="lang-switcher">
            <button onclick="setLanguage('en')">English</button>
            <button onclick="setLanguage('ar')">العربية</button>
            <button onclick="setLanguage('fr')">Français</button>
        </div>
    </header>

    <div class="container">
        <h1 id="txt-heading">Free Online Conversion Tools</h1>
        <p id="txt-desc">Convert currencies, measurements, and units quickly and easily without annoying ads.</p>
    </div>

    <script>
        const translations = {
            en: {
                dir: "ltr",
                title: "Conversion Tools",
                logo: "Conversion Tools",
                heading: "Free Online Conversion Tools",
                desc: "Convert currencies, measurements, and units quickly and easily without annoying ads."
            },
            ar: {
                dir: "rtl",
                title: "أدوات التحويل",
                logo: "أدوات التحويل",
                heading: "أدوات التحويل المجانية عبر الإنترنت",
                desc: "قم بتحويل العملات، القياسات، والوحدات بسرعة وسهولة وبدون إعلانات مزعجة."
            },
            fr: {
                dir: "ltr",
                title: "Outils de Conversion",
                logo: "Outils de Conversion",
                heading: "Outils de Conversion en Ligne Gratuits",
                desc: "Convertissez des devises, des mesures et des unités rapidement et facilement sans publicités ennuyeuses."
            }
        };

        function setLanguage(lang) {
            const t = translations[lang];
            if (!t) return;

            document.getElementById('html-root').setAttribute('lang', lang);
            document.getElementById('html-root').setAttribute('dir', t.dir);
            document.getElementById('page-title').innerText = t.title;
            document.getElementById('txt-logo').innerText = t.logo;
            document.getElementById('txt-heading').innerText = t.heading;
            document.getElementById('txt-desc').innerText = t.desc;
        }
    </script>

</body>
</html>
